    <marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#d07822"/></marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b42318"/></marker>
    <style>
      text { font-family: "Noto Sans KR", "Malgun Gothic", sans-serif; fill: #172033; }
      .title { font-size: 38px; font-weight: 800; }
      .subtitle { font-size: 19px; fill: #566176; }
      .lane-title { font-size: 24px; font-weight: 800; }
      .node-title { font-size: 20px; font-weight: 750; }
      .body { font-size: 16px; fill: #334155; }
      .small { font-size: 14px; fill: #475569; }
      .tiny { font-size: 12px; fill: #475569; }
      .pill { font-size: 13px; font-weight: 750; }
      .card { fill: #fff; stroke-width: 2; rx: 16; }
      .file { font-family: Consolas, "Cascadia Code", monospace; font-size: 13px; fill: #1e3a5f; }
      .arrow-label { font-size: 12px; font-weight: 700; fill: #475569; }
    </style>
  </defs>

  <rect width="1920" height="2210" fill="#f5f7fb"/>
  <text x="60" y="70" class="title">이 프로젝트에서 데이터가 흘러가는 길</text>
  <text x="60" y="108" class="subtitle">현재 페이지가 실제로 쓰는 데이터, 모델을 만드는 데이터, 아직 웹에 연결되지 않은 모델을 한 장에 구분했습니다.</text>

