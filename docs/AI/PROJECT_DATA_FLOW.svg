  <rect x="42" y="1052" width="1836" height="410" rx="24" fill="#fff7ed" stroke="#f1d2ae" stroke-width="2"/>
  <text x="70" y="1094" class="lane-title" fill="#9a5315">3. 아직 이어지지 않은 부분: 모델 예측을 추천 결과로 만들기</text>
  <text x="70" y="1121" class="small">모델 파일은 있지만, 브라우저는 아직 모델을 호출하지 않습니다. 아래는 연결되어야 할 흐름입니다.</text>

  <rect x="75" y="1170" width="330" height="145" class="card" stroke="#d99a58" stroke-dasharray="8 6"/>
  <text x="98" y="1205" class="node-title">사용자가 고르는 조건</text>
  <text x="98" y="1235" class="body">출발 위치 · 날짜 · 05~24시 범위</text>
  <text x="98" y="1263" class="body">거리/한산함 비중 (10% 단위)</text>
  <text x="98" y="1291" class="small">방향과 시간은 열차 경로에 필요</text>

  <rect x="480" y="1170" width="365" height="145" class="card" stroke="#d99a58" stroke-dasharray="8 6"/>
  <text x="503" y="1205" class="node-title">필요한 예측 API (미구현)</text>
  <text x="503" y="1235" class="body">페이지 요청을 받아 입력을 만들고</text>
  <text x="503" y="1263" class="body">모델을 불러 역별 예상 재차 인원 반환</text>
  <text x="503" y="1291" class="small">예: Python/FastAPI 로컬 서버</text>

  <rect x="920" y="1170" width="330" height="145" class="card" stroke="#d99a58" stroke-dasharray="8 6"/>
  <text x="943" y="1205" class="node-title">현재 CLI 예측 도구</text>
  <text x="943" y="1235" class="file">predict_load.py</text>
  <text x="943" y="1263" class="small">모델을 읽어 한 역·시각·방향 예측</text>
  <text x="943" y="1291" class="small">웹 페이지에서 호출되지는 않음</text>

  <rect x="1325" y="1170" width="480" height="145" class="card" stroke="#d99a58" stroke-dasharray="8 6"/>
