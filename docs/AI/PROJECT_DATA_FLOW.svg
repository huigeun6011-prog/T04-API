  <text x="60" y="1505" class="tiny">파일 위치는 프로젝트 기준 상대 경로입니다. 이 그림은 현재 코드/산출물의 연결 상태를 설명하며, 점선은 아직 구현되지 않은 제안 흐름입니다.</text>
