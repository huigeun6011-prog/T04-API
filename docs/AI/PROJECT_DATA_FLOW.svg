<rect x="992" y="1160" width="340" height="168" rx="16" fill="#fff" stroke="#a48ac2" stroke-width="2"/><text x="1012" y="1192" class="node-title">같은 변환기 재사용</text><text x="1012" y="1222" class="file">subway_time_to_json.py</text><text x="1012" y="1246" class="small">입력을 (c)로 바꾸어 실행</text><text x="1012" y="1270" class="small">→ subway_time.json</text><text x="1012" y="1294" class="small">날짜를 붙여 20260330 JSON 저장</text>
