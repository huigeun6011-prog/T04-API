<!-- Lane 2: Training pipeline -->
<rect x="42" y="580" width="1836" height="1410" rx="24" fill="#f3effa" stroke="#ddcfee" stroke-width="2"/>
<text x="70" y="622" class="lane-title">2. 혼잡도 모델을 만드는 학습 흐름</text>
<text x="70" y="649" class="small">운행일별 승하차 + 버전별 시간표로 재차인원을 추정하고, 과거 날씨를 붙여 학습 CSV를 만듭니다.</text>
<rect x="72" y="710" width="240" height="150" rx="16" fill="#fff" stroke="#a48ac2" stroke-width="2"/><text x="92" y="742" class="node-title">원본 승하차 XML</text><text x="92" y="772" class="file">data/raw/subway/*.xml</text><text x="92" y="796" class="small">collect_data.py로 API 수집</text>
<rect x="382" y="710" width="260" height="150" rx="16" fill="#fff" stroke="#a48ac2" stroke-width="2"/><text x="402" y="742" class="node-title">시간 자료 정제</text><text x="402" y="772" class="file">process_subway.py</text><text x="402" y="796" class="small">01~04시 제외</text><text x="402" y="820" class="small">00시와 05~23시 보존</text>
<rect x="712" y="710" width="250" height="150" rx="16" fill="#fff" stroke="#a48ac2" stroke-width="2"/><text x="732" y="742" class="node-title">정제된 승하차 JSON</text><text x="732" y="772" class="file">data/processed/subway/</text><text x="732" y="796" class="small">달력 날짜별 역·시간 집계</text>
<rect x="1032" y="1450" width="300" height="150" rx="16" fill="#fff" stroke="#a48ac2" stroke-width="2"/><text x="1052" y="1482" class="node-title">재차인원 추정·입력 결합</text><text x="1052" y="1512" class="file">generate_ground_truth.py</text><text x="1052" y="1536" class="small">당일 05~23시 + 익일 00시</text><text x="1052" y="1560" class="small">물리 제약으로 load 라벨 생성</text>
<rect x="1402" y="1450" width="405" height="150" rx="16" fill="#fff" stroke="#a48ac2" stroke-width="2"/><text x="1422" y="1482" class="node-title">학습 CSV → 모델</text><text x="1422" y="1512" class="file">ground_truth_train_loads.csv</text><text x="1422" y="1536" class="small">train_predict_model.py</text><text x="1422" y="1560" class="small">→ outputs/load_predictor.joblib</text>
