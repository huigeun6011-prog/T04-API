  <text x="1348" y="1235" class="body">“몇 시에 · 어느 역을 이용해 · 어디로”</text>
  <text x="1348" y="1263" class="body">경로 예상 혼잡 + 장소까지 거리로 순위</text>
  <text x="1348" y="1291" class="small">혼잡도는 장소 자체가 아닌 이동 구간 기준</text>

