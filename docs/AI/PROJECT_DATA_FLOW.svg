<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="2610" viewBox="0 0 1920 2610" role="img" aria-labelledby="title desc">
  <title id="title">프로젝트 데이터와 웹 페이지 연결 구조</title>
  <desc id="desc">장소 데이터와 날씨가 현재 웹 페이지에서 쓰이는 방식, 지하철 데이터를 사용해 혼잡도 모델을 학습하는 흐름, 모델을 웹 추천에 연결하기 위해 남은 일을 구분한 구조도</desc>
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2878b8"/></marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#25845a"/></marker>
