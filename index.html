<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>대전 1호선 & 날씨 대시보드</title>
    <link rel="stylesheet" href="style.css">
    <!-- 아이콘 라이브러리 (Font Awesome) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="dashboard">
        <header>
            <h1><i class="fa-solid fa-train-subway"></i> 대전 1호선 & 날씨 대시보드</h1>
            <div class="controls">
                <div class="control-group">
                    <label for="datePicker">날짜 선택</label>
                    <input type="date" id="datePicker" min="2026-10-01" max="2026-11-30">
                </div>
                <div class="control-group">
                    <label for="timeSlider">시간 선택: <span id="timeDisplay">12:00</span></label>
                    <input type="range" id="timeSlider" min="0" max="23" value="12">
                </div>
            </div>
        </header>

        <main>
            <div class="weather-panel" id="weatherPanel">
                <!-- 날씨 정보가 여기에 표시됩니다 -->
                <div class="weather-item"><i id="weatherIcon" class="fa-solid fa-cloud-rain"></i> <span id="weatherPrecip">0.0 mm</span></div>
                <div class="weather-item"><i class="fa-solid fa-temperature-half"></i> <span id="weatherTemp">0.0 °C</span></div>
                <div class="weather-item"><i class="fa-solid fa-snowflake"></i> <span id="weatherSnow">0.0 cm</span></div>
            </div>

            <div class="subway-map-container">
                <svg id="subwayMap" viewBox="0 0 1100 400" preserveAspectRatio="xMidYMid meet">
                    <!-- 노선도가 여기에 동적으로 그려집니다 -->
                </svg>
            </div>
        </main>
    </div>
    <script src="app.js"></script>
</body>
</html>
