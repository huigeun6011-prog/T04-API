name: T04 daily record
on:
  schedule:
    - cron: '10 3 * * *' # 12:10 KST. 자정(KST) 경계를 피한다.
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: t04-daily-record
jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - run: node scripts/t04_daily_record.mjs
      - name: Commit record
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add static-web/data/t04/daily.json
          git diff --cached --quiet || git commit -m "T04 일별 기록 $(date -u +%F)"
          for attempt in 1 2 3; do
            echo "Record push attempt ${attempt}/3"
            if git pull --rebase origin "$GITHUB_REF_NAME" && git push; then
              exit 0
            fi
            if [[ -d "$(git rev-parse --git-path rebase-merge)" || -d "$(git rev-parse --git-path rebase-apply)" ]]; then
              git rebase --abort
            fi
          done
          echo "::error::T04 daily record was not pushed after 3 attempts (local HEAD $(git rev-parse --short HEAD))."
          exit 1
  deploy:
    needs: record
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      pages: write
      id-token: write
    # GITHUB_TOKEN pushes do not trigger the Pages push workflow.
    uses: ./.github/workflows/pages.yml
