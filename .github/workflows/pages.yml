name: Deploy static web to GitHub Pages

on:
  push:
    branches: [main]
    paths: ['static-web/**', 'data/raw/weather/**', 'scripts/sync_static_data.mjs']
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: main
      # 공개 사본(날씨, daily.json 이 참조하는 XML)은 커밋하지 않고 배포 때 원본에서 만든다.
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
      - name: Generate static data copies
        run: node scripts/sync_static_data.mjs
      - uses: actions/configure-pages@v6.0.0
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: static-web
      - id: deployment
        uses: actions/deploy-pages@v5.0.1
